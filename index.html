<!doctype html> 
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>王静晗｜平面作品集</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#111;background:#fff}
    header{max-width:1080px;margin:0 auto;padding:28px 20px 18px}
    h1{margin:0 0 6px;font-size:24px;font-weight:650}
    p{margin:0 0 16px;color:#666;font-size:14px}
    a.button{display:inline-block;padding:10px 14px;border:1px solid #111;border-radius:8px;color:#111;text-decoration:none;font-size:14px}
    main{max-width:1080px;margin:0 auto;padding:0 20px 24px}
    .pdf{width:100%;height:calc(100vh - 150px);min-height:680px;border:1px solid #ddd;border-radius:8px;overflow:hidden;background:#f7f7f7}
    iframe{width:100%;height:100%;border:0}
    @media (max-width:700px){header{padding-top:20px}.pdf{min-height:72vh;height:72vh}}
  </style>
</head>
<body>
  <header>
    <h1>王静晗｜平面作品集</h1>
    <p>Graphic Design Portfolio</p>
    <a class="button" href="portfolio.pdf" target="_blank" rel="noopener">打开完整 PDF ↗</a>
  </header>
  <main>
    <div class="pdf">
      <iframe src="portfolio.pdf#view=FitH" title="王静晗平面作品集"></iframe>
    </div>
  </main>
</body>
</html>
